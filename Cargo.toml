# 서버사이드 SDK 워크스페이스 — 서버 oxlens-sfu 와 같은 꼴(크레이트는 crates/ 밑 · 디렉터리 = 패키지 = 실행 파일 이름 · 이름이 종류를 말한다 · context 202611/20261112g).
#   crates/oxpeer      서버사이드 SDK 라이브러리(SDK:RULE-PLAT-SERVER) — 예제 agent_echo · 도구 mkvcheck · rawtool · rawbench
#   crates/oxbridge-ai AI 에이전트 브리지(SDK:RULE-PLAT-AGENT) — oxpeer 공개 표면만 쓴다(202611/20261112a E7)
#   crates/oxrec       녹음 · 녹화 실행 파일(SDK:RULE-PLAT-REC-*) — 받기만 하는 앱
# 한 Cargo.lock · 한 target(워크스페이스 뿌리)
[workspace]
members = ["crates/oxpeer", "crates/oxbridge-ai", "crates/oxrec"]
resolver = "3"

[workspace.package]
